<html lang="zh-CN">
<head>

  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;color:#17221e;background:#f4f7f5;font-synthesis:none;text-rendering:optimizeLegibility;--green:#0b6b53;--green2:#13846a;--pale:#e6f4ef;--muted:#75827c;--line:#e8eeeb;--orange:#e98b37;--red:#c55050}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#f4f7f5}button,input,select,textarea{font:inherit}button{cursor:pointer}#app{max-width:520px;min-height:100dvh;margin:auto;background:#f4f7f5;position:relative;padding-bottom:calc(78px + env(safe-area-inset-bottom))}.top{height:58px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:9px;font-weight:750;letter-spacing:.2px}.logo{height:32px;width:32px;border-radius:11px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800}.role-label{font-size:12px;color:var(--green);background:var(--pale);padding:6px 10px;border-radius:99px}.mock-banner{margin:12px 16px 0;padding:9px 11px;border:1px solid #f0d6a8;background:#fff9ec;border-radius:11px;color:#8a652b;font-size:11px;line-height:1.45}.page{padding:18px 16px 20px}.welcome{font-size:24px;line-height:1.25;font-weight:780;margin:2px 0 7px}.sub{color:var(--muted);font-size:13px;margin:0}.hero{background:linear-gradient(135deg,#0b6b53,#148269);color:white;border-radius:20px;padding:20px;margin:18px 0;box-shadow:0 10px 26px #0b6b5325}.hero h2{font-size:18px;margin:0 0 8px}.hero p{font-size:13px;opacity:.86;line-height:1.6;margin:0 0 16px}.hero .btn{background:white;color:var(--green)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{display:block;font-size:22px;margin-bottom:5px}.stat span{font-size:11px;color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px;font-weight:700;font-size:16px}.text-btn{border:0;background:none;color:var(--green);font-size:13px;padding:4px}.card{margin-bottom:11px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:var(--muted);font-size:12px}.order-no{font-size:12px;color:var(--muted)}.order-title{font-size:15px;font-weight:700;margin:8px 0}.tag{display:inline-flex;align-items:center;border-radius:99px;padding:5px 9px;background:#eef2f0;color:#56635d;font-size:11px;white-space:nowrap}.tag.green{background:#e6f4ef;color:#0b6b53}.tag.orange{background:#fff1df;color:#a55a19}.tag.blue{background:#eaf2ff;color:#3866a8}.progress{height:5px;background:#e9efec;border-radius:5px;margin:14px 0 9px;overflow:hidden}.progress i{display:block;height:100%;background:#26a37e;border-radius:5px}.btn{border:0;border-radius:12px;background:var(--green);color:white;font-weight:650;padding:13px 16px;min-height:46px}.btn:active{transform:scale(.985)}.btn.secondary{background:#edf4f1;color:var(--green)}.btn.ghost{background:white;border:1px solid #d9e4de;color:var(--green)}.btn.danger{background:#fff0ef;color:var(--red)}.btn.full{width:100%}.actions{display:flex;gap:9px;margin-top:14px}.actions>*{flex:1}.field{margin:13px 0}.field label{display:block;font-size:12px;color:#56635d;font-weight:650;margin-bottom:7px}.input,select,textarea{width:100%;border:1px solid #dfe8e3;background:#fff;border-radius:12px;padding:13px 14px;outline:none;color:#17221e}.input:focus,select:focus,textarea:focus{border-color:#57a88f;box-shadow:0 0 0 3px #13846a12}textarea{resize:vertical;min-height:92px}.auth-wrap{padding:28px 20px 34px}.auth-brand{text-align:center;padding:18px 0 20px}.auth-brand .logo{height:54px;width:54px;border-radius:18px;margin:0 auto 13px;font-size:20px}.auth-brand h1{font-size:22px;margin:0 0 8px}.auth-brand p{font-size:13px;color:var(--muted);margin:0}.switch{display:grid;grid-template-columns:1fr 1fr;background:#edf2ef;padding:4px;border-radius:12px;margin:12px 0 20px}.switch button{border:0;background:transparent;color:var(--muted);padding:10px;border-radius:9px;font-size:13px}.switch button.active{background:#fff;color:var(--green);font-weight:700;box-shadow:0 2px 6px #13271d12}.captcha-row{display:flex;gap:9px}.captcha{width:104px;flex:0 0 104px;border-radius:12px;background:#eef4e9;color:#365d47;font-weight:800;letter-spacing:4px;display:grid;place-items:center;border:1px dashed #a9c7b5}.hint{font-size:11px;color:var(--muted);line-height:1.6;margin:10px 0}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:calc(66px + env(safe-area-inset-bottom));padding:7px 9px env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:6}.tabs button{border:0;background:none;color:#8a9690;min-width:70px;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.tabs button.active{color:var(--green);font-weight:700}.icon{font-size:19px;line-height:1}.back{border:0;background:none;padding:4px 8px 4px 0;color:var(--green);font-weight:650}.detail-hero{background:#fff;border-radius:17px;padding:17px;border:1px solid var(--line);margin:12px 0}.timeline{border-left:2px solid #d8e9e1;margin:14px 0 4px 5px;padding-left:16px}.timeline-item{position:relative;padding:2px 0 16px;font-size:13px}.timeline-item:before{content:"";position:absolute;left:-22px;top:5px;width:9px;height:9px;border-radius:50%;background:#1b9a75;border:2px solid white;box-shadow:0 0 0 1px #1b9a75}.timeline-item small{display:block;color:var(--muted);margin-top:5px;font-size:11px}.empty{text-align:center;padding:30px 18px;color:var(--muted);font-size:13px}.profile{display:flex;align-items:center;gap:12px;padding:17px;background:#fff;border:1px solid var(--line);border-radius:16px}.avatar{height:45px;width:45px;display:grid;place-items:center;border-radius:50%;background:var(--pale);color:var(--green);font-weight:800;font-size:17px}.toast{position:fixed;z-index:20;left:50%;bottom:86px;transform:translate(-50%,20px);padding:11px 16px;background:#23352e;color:white;border-radius:12px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.divider{height:1px;background:var(--line);margin:13px 0}.task-meta{display:grid;grid-template-columns:1fr 1fr;gap:11px}.task-meta .card{margin:0}.pill-row{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.pill{border:1px solid #dfe8e3;border-radius:999px;background:#fff;color:#68746e;padding:8px 12px;white-space:nowrap;font-size:12px}.pill.active{background:var(--green);border-color:var(--green);color:white}@media(min-width:600px){body{padding:24px 0}.top{border-radius:18px 18px 0 0}.tabs{bottom:24px;border-radius:0 0 18px 18px}}
  </style>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;color:#172033;background:#f4f6fb;font-synthesis:none;text-rendering:optimizeLegibility;--green:#4968e8;--green2:#6885ff;--pale:#edf1ff;--muted:#8790a3;--line:#e9ecf4;--orange:#e8963e;--red:#dc5b68}
    *{-webkit-tap-highlight-color:transparent}body{background:#f4f6fb}#app{max-width:480px;background:#f4f6fb;padding-bottom:calc(88px + env(safe-area-inset-bottom))}.top{height:64px;padding:0 22px;background:rgba(255,255,255,.92);border:0;box-shadow:0 1px 0 rgba(28,39,70,.04);backdrop-filter:blur(18px)}.brand{gap:10px;font-size:15px;letter-spacing:-.25px}.logo{height:35px;width:35px;border-radius:13px;background:linear-gradient(145deg,#7890ff,#4968e8);box-shadow:0 5px 12px #4968e833;color:#fff;font-size:16px}.role-label{font-size:11px;background:#eff2ff;color:#526bd5;padding:7px 11px;font-weight:650}.mock-banner{margin:12px 18px 0;padding:9px 12px;border:1px solid #e9edfb;background:#f9faff;border-radius:13px;color:#7883a3;font-size:10px}.page{padding:23px 19px 26px}.welcome{font-size:27px;line-height:1.2;letter-spacing:-.8px;font-weight:760;margin:2px 0 8px}.sub{font-size:13px;color:#858ea1}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#526fe9 0%,#758bfa 100%);border-radius:25px;padding:23px 21px;margin:21px 0;box-shadow:0 12px 26px #536fe92c}.hero:after{content:"";position:absolute;width:168px;height:168px;border:1px solid #ffffff24;border-radius:50%;right:-46px;top:-75px;box-shadow:0 0 0 23px #ffffff0d,0 0 0 48px #ffffff08}.hero h2{font-size:20px;letter-spacing:-.4px}.hero p{font-size:12px;max-width:245px;line-height:1.65;opacity:.9}.hero .btn{position:relative;z-index:1;border-radius:14px;padding:11px 16px;min-height:43px;box-shadow:0 5px 14px #283f9c26}.stats{gap:9px;margin:16px 0 22px}.stat,.card{background:#fff;border:1px solid #edf0f6;border-radius:20px;box-shadow:0 5px 18px rgba(28,39,70,.035)}.stat{padding:14px 10px}.stat b{font-size:23px;letter-spacing:-.6px;margin-bottom:4px}.stat span{font-size:10px;color:#858ea1}.section-title{font-size:16px;letter-spacing:-.2px;margin:23px 2px 12px}.card{padding:16px;margin-bottom:12px}.order-title{font-size:15px;letter-spacing:-.2px;margin:10px 0}.order-no{font-size:10px;letter-spacing:.1px;color:#929aac}.muted{color:#858ea1;font-size:11px;line-height:1.55}.tag{padding:6px 10px;font-size:10px;font-weight:650;background:#f0f2f7;color:#6f7788}.tag.green{background:#eaf7f1;color:#398c6c}.tag.orange{background:#fff4e8;color:#ba742b}.tag.blue{background:#edf2ff;color:#5871d2}.progress{height:5px;background:#edf0f6;margin:15px 0 10px}.progress i{background:linear-gradient(90deg,#75a4ff,#5472ed)}.btn{border-radius:15px;background:linear-gradient(135deg,#5d7afa,#4968e8);font-size:14px;font-weight:680;min-height:49px;box-shadow:0 6px 15px #4968e823}.btn.secondary{background:#eef2ff;color:#516cdb;box-shadow:none}.btn.ghost{background:#fff;border:1px solid #e6eaf4;color:#526de0;box-shadow:none}.btn.danger{background:#fff1f2;color:#d35d6b;box-shadow:none}.actions{gap:10px}.field{margin:16px 0}.field label{font-size:12px;color:#596277;font-weight:650;margin-bottom:8px}.input,select,textarea{border:1px solid #e7eaf2;background:#fff;border-radius:15px;padding:14px 15px;color:#172033;box-shadow:0 2px 5px #29375a05}.input::placeholder,textarea::placeholder{color:#b1b7c4}.input:focus,select:focus,textarea:focus{border-color:#8195f6;box-shadow:0 0 0 4px #6580f51a}.auth-wrap{padding:34px 22px}.auth-brand{padding:24px 0 25px}.auth-brand .logo{height:62px;width:62px;border-radius:21px;margin-bottom:17px;font-size:22px}.auth-brand h1{font-size:24px;letter-spacing:-.6px}.auth-brand p{font-size:12px}.switch{background:#ebedf4;border-radius:14px;padding:4px;margin:10px 0 22px}.switch button{border-radius:11px;padding:11px;font-size:12px}.switch button.active{color:#4f69d4;box-shadow:0 2px 8px #17264a14}.captcha{background:#f0f3ff;color:#5268bf;border:1px dashed #c6d0ff;border-radius:14px}.hint{font-size:10px;line-height:1.65;color:#8991a2;margin:11px 1px}.tabs{height:calc(76px + env(safe-area-inset-bottom));padding:8px 10px env(safe-area-inset-bottom);background:rgba(255,255,255,.91);border:0;box-shadow:0 -7px 24px rgba(40,52,90,.055);backdrop-filter:blur(20px);border-radius:22px 22px 0 0}.tabs button{color:#a1a8b6;min-width:78px;font-size:10px;gap:5px}.tabs button.active{color:#526ee4;font-weight:700}.icon{font-size:20px;line-height:1}.back{color:#526ee4;font-size:13px}.detail-hero{border:1px solid #edf0f6;border-radius:21px;padding:18px;box-shadow:0 5px 18px #1c274608}.timeline{border-color:#dfe6ff}.timeline-item:before{background:#5c78ee;box-shadow:0 0 0 1px #5c78ee}.profile{border:1px solid #edf0f6;border-radius:20px;box-shadow:0 5px 18px #1c274608}.avatar{background:linear-gradient(145deg,#eef2ff,#e5ebff);color:#526de0}.toast{border-radius:15px;background:#252c40;box-shadow:0 8px 24px #141b2b33}.pill-row{gap:7px}.pill{border:1px solid #e7eaf2;border-radius:99px;color:#70798d;padding:9px 14px;font-size:11px}.pill.active{background:#536fe9;border-color:#536fe9;box-shadow:0 5px 12px #536fe933}.task-meta .card{padding:14px}.divider{background:#edf0f6}.empty{color:#9199a9}
    @media(min-width:600px){body{padding:24px 0}#app{border-radius:24px;overflow:hidden;box-shadow:0 20px 60px #202c5014}.top{border-radius:24px 24px 0 0}.tabs{bottom:24px;border-radius:20px}}
  </style>
  <style>
    .icon-svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}.logo .icon-svg{width:20px;height:20px;stroke:#fff;stroke-width:1.9}.tabs button .icon-svg{width:21px;height:21px;stroke-width:1.85}.brand .icon-svg{width:19px;height:19px}
  </style>

<body>
<div id="app"></div><div class="toast" id="toast"></div>
<script>
(() => {
  const role = new URLSearchParams(location.search).get('role') === 'engineer' ? 'engineer' : 'customer';
  const app = document.getElementById('app');
  const state = { authed: localStorage.getItem(`demo-${role}-auth`) === '1', mode:'login', page:'home', tab:'home', selected:null, filter:'全部' };
  const seedRepairs = [{id:'WX-2026-0018',title:'冷却设备异常噪声',status:'维修中',address:'上海市浦东新区示范路 88 号',time:'今天 09:30',progress:68},{id:'WX-2026-0012',title:'控制柜定期巡检',status:'待确认',address:'上海市浦东新区科创园 3 号楼',time:'昨天 14:10',progress:92}];
  const repairs = JSON.parse(localStorage.getItem('demo-repairs') || 'null') || seedRepairs;
  const seedTasks = [{id:'WX-2026-0021',title:'空调机组无法启动',customer:'华东示范客户',address:'上海市闵行区建设路 18 号',status:'待接单',time:'今天 10:25',progress:10},{id:'WX-2026-0018',title:'冷却设备异常噪声',customer:'浦东工业服务中心',address:'上海市浦东新区示范路 88 号',status:'进行中',time:'今天 09:30',progress:62},{id:'WX-2026-0014',title:'办公区照明检修',customer:'启明科技园',address:'上海市徐汇区漕河泾开发区',status:'已完成',time:'昨天 16:40',progress:100}];
  const tasks = JSON.parse(localStorage.getItem('demo-tasks') || 'null') || seedTasks;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const save = () => { localStorage.setItem('demo-repairs',JSON.stringify(repairs)); localStorage.setItem('demo-tasks',JSON.stringify(tasks)); };
  const toast = msg => { const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2100); };
  const icon = (name) => { const d={home:'M3 10.8 12 3l9 7.8v9.1a1.1 1.1 0 0 1-1.1 1.1h-5.2v-6.2H9.3V21H4.1A1.1 1.1 0 0 1 3 19.9z',list:'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01',user:'M20 21a8 8 0 0 0-16 0M12 13a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',pin:'M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0zM12 10h.01',arrow:'m9 18 6-6-6-6',plus:'M12 5v14M5 12h14',spark:'m12 3 1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3z',wrench:'m14.7 6.3 3 3M4 20l8.2-8.2m1.6-6.3a5 5 0 0 0 6.7 6.7l-4 4-6.7-6.7 4-4z'};return `<svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="${d[name]||d.spark}"/></svg>`; };
  const header = () => `<header class="top"><div class="brand"><div class="logo">${icon('spark')}</div><span>LS・Aegis</span></div><span class="role-label">${role==='customer'?'客户端模拟':'工程师端模拟'}</span></header><div class="mock-banner">交互原型 · 使用本地模拟数据，不会连接后台或提交真实工单</div>`;
  const statusTag = s => `<span class="tag ${s==='维修中'||s==='进行中'?'green':s==='待确认'||s==='待接单'?'orange':s==='已完成'?'blue':''}">${esc(s)}</span>`;
  function login() {
    const engineer = role==='engineer';
    const title = engineer?'工程师工作台':'客户服务门户';
    const customerSwitch = !engineer ? `<div class="switch"><button class="${state.mode==='login'?'active':''}" data-mode="login">账号登录</button><button class="${state.mode==='activate'?'active':''}" data-mode="activate">首次激活</button></div>` : '';
    const activation = !engineer && state.mode==='activate';
    return `${header()}<main class="auth-wrap"><div class="auth-brand"><div class="logo">${icon('spark')}</div><h1>${title}</h1><p>${engineer?'登录后查看分配给你的维修任务':'用用户名和密码，随时查看维修进度'}</p></div>${customerSwitch}<form id="login-form"><div class="field"><label>用户名</label><input class="input" name="username" autocomplete="username" placeholder="输入用户名" required></div>${activation?`<div class="field"><label>管理员邀请码</label><input class="input" name="invite" placeholder="演示邀请码：DEMO-2026" required></div>`:''}<div class="field"><label>密码</label><input class="input" type="password" name="password" autocomplete="current-password" placeholder="输入密码" required></div>${!engineer?`<div class="field"><label>图形验证码</label><div class="captcha-row"><input class="input" name="captcha" placeholder="输入 4821" required><div class="captcha">4821</div></div></div>`:''}<button class="btn full" type="submit">${engineer?'进入工程师端':activation?'激活并登录':'登录客户门户'}</button></form><p class="hint">${engineer?'模拟账号可任意填写；此原型不连接平台账号。':'首次激活需邀请码。忘记密码请联系管理员重新签发。演示模式下邀请码填写 DEMO-2026，验证码填写 4821。'}</p><p class="hint">建议用不同的用户名分别体验客户端和工程师端；模拟数据保存在本机浏览器，可通过“我的”页面清除。</p></main>`;
  }
  function customerHome() {
    const active = repairs.find(r=>r.status==='维修中'||r.status==='待确认');
    return `<main class="page"><h1 class="welcome">你好，${esc(localStorage.getItem('demo-customer-name')||'客户')}</h1><p class="sub">设备维修进度，一目了然</p><section class="hero"><h2>设备有问题？</h2><p>提交故障信息和现场照片，维修团队会尽快联系你。</p><button class="btn" data-page="apply">＋ 在线报修</button></section><div class="stats"><div class="stat"><b>${repairs.length}</b><span>全部报修</span></div><div class="stat"><b>${repairs.filter(r=>r.status==='维修中').length}</b><span>维修中</span></div><div class="stat"><b>${repairs.filter(r=>r.status==='待确认').length}</b><span>待确认</span></div></div><div class="section-title"><span>最近维修</span><button class="text-btn" data-tab="repairs">全部记录 ›</button></div>${active?repairCard(active,true):`<div class="card empty">暂无进行中的维修</div>`}<div class="section-title"><span>服务提示</span></div><div class="card muted">客户确认只在维修完成后开放。此模拟器不会生成真实通知或财务单据。</div></main>${customerTabs()}`;
  }
  function repairCard(item, compact=false) { return `<article class="card" data-open-repair="${esc(item.id)}"><div class="row"><span class="order-no">${esc(item.id)}</span>${statusTag(item.status)}</div><h3 class="order-title">${esc(item.title)}</h3><div class="muted">${esc(item.address)}</div><div class="progress"><i style="width:${item.progress}%"></i></div><div class="row"><span class="muted">${esc(item.time)}</span><button class="text-btn" data-open-repair="${esc(item.id)}">查看详情 ›</button></div></article>`; }
  function customerRepairs() { return `<main class="page"><h1 class="welcome">我的报修</h1><p class="sub">跟踪每一条服务进度</p><div class="section-title"><span>全部记录 · ${repairs.length}</span><button class="text-btn" data-page="apply">＋ 新报修</button></div>${repairs.length?repairs.map(r=>repairCard(r)).join(''):`<div class="card empty">还没有报修记录，点右上角开始报修。</div>`}</main>${customerTabs()}`; }
  function repairDetail(id) { const r=repairs.find(x=>x.id===id)||repairs[0]; if(!r)return customerRepairs(); return `<main class="page"><button class="back" data-back>‹ 返回报修</button><div class="detail-hero"><div class="row"><span class="order-no">${esc(r.id)}</span>${statusTag(r.status)}</div><h2 class="order-title">${esc(r.title)}</h2><p class="muted">${esc(r.address)}</p><div class="progress"><i style="width:${r.progress}%"></i></div><div class="muted">当前进度 ${r.progress}%</div></div><div class="section-title"><span>服务进度</span></div><div class="card"><div class="timeline"><div class="timeline-item">报修已提交<small>${esc(r.time)} · 申请已创建</small></div><div class="timeline-item">工程师已接单<small>维修团队已收到任务</small></div><div class="timeline-item">${r.status==='待确认'?'维修已完成，等待客户确认':'现场维修处理中'}<small>${r.status==='待确认'?'请检查维修结果后确认':'工程师会更新维修记录'}</small></div></div></div><div class="section-title"><span>设备与联系人</span></div><div class="card muted">设备：中央空调机组 A-03<br><br>联系人：王先生　　电话：138****1024</div>${r.status==='待确认'?`<button class="btn full" data-confirm="${esc(r.id)}">确认维修完成</button>`:''}</main>`; }
  function applyForm() { return `<main class="page"><button class="back" data-back>‹ 返回</button><h1 class="welcome" style="margin-top:18px">在线报修</h1><p class="sub">请描述故障情况，方便工程师提前准备</p><form id="apply-form"><div class="field"><label>设备名称</label><input class="input" name="equipment" placeholder="例如：冷却设备 1 号机" required></div><div class="field"><label>故障类型</label><select name="type"><option>设备无法启动</option><option>运行异常 / 异响</option><option>定期巡检</option><option>其他故障</option></select></div><div class="field"><label>故障描述</label><textarea name="desc" placeholder="请描述故障表现" required></textarea></div><div class="field"><label>服务地址</label><input class="input" name="address" placeholder="选择或填写服务地点" required></div><div class="field"><label>联系人</label><input class="input" name="contact" placeholder="联系人姓名" required></div><div class="field"><label>联系电话</label><input class="input" name="phone" type="tel" placeholder="联系电话" required></div><div class="field"><label>现场照片</label><button type="button" class="btn ghost full" id="photo-btn">＋ 添加现场照片（模拟）</button><p id="photo-hint" class="hint">原型演示不访问相机或相册。</p></div><button class="btn full" type="submit">提交报修</button></form></main>`; }
  function customerProfile() { const name=localStorage.getItem('demo-customer-name')||'演示客户'; return `<main class="page"><h1 class="welcome">我的</h1><p class="sub">个人信息与服务设置</p><div class="profile" style="margin-top:18px"><div class="avatar">${esc(name.slice(0,1).toUpperCase())}</div><div><b>${esc(name)}</b><div class="muted" style="margin-top:5px">客户账号 · 演示环境</div></div></div><div class="section-title"><span>账号安全</span></div><div class="card muted">账号激活、密码重置和会话安全会接入正式后台版本。</div><button class="btn danger full" data-reset style="margin-top:20px">清除本机模拟数据并退出</button></main>${customerTabs()}`; }
  function customerTabs() { const t=state.tab; return `<nav class="tabs"><button class="${t==='home'?'active':''}" data-tab="home">${icon('home')}首页</button><button class="${t==='repairs'?'active':''}" data-tab="repairs">${icon('list')}我的报修</button><button class="${t==='profile'?'active':''}" data-tab="profile">${icon('user')}我的</button></nav>`; }
  function engineerHome() { const filtered=state.filter==='全部'?tasks:tasks.filter(t=>state.filter==='待处理'?t.status==='待接单':state.filter==='进行中'?t.status==='进行中':t.status==='已完成'); return `<main class="page"><h1 class="welcome">早上好，${esc(localStorage.getItem('demo-engineer-name')||'工程师')}</h1><p class="sub">今天有新的现场任务等待处理</p><div class="stats"><div class="stat"><b>${tasks.filter(t=>t.status==='待接单').length}</b><span>待接任务</span></div><div class="stat"><b>${tasks.filter(t=>t.status==='进行中').length}</b><span>进行中</span></div><div class="stat"><b>${tasks.filter(t=>t.status==='已完成').length}</b><span>已完成</span></div></div><div class="section-title"><span>我的任务</span><span class="muted">${tasks.length} 条</span></div><div class="pill-row">${['全部','待处理','进行中','已完成'].map(x=>`<button class="pill ${state.filter===x?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div><div style="height:10px"></div>${filtered.length?filtered.map(taskCard).join(''):`<div class="card empty">当前筛选下没有任务</div>`}</main>${engineerTabs()}`; }
  function taskCard(t) { return `<article class="card" data-open-task="${esc(t.id)}"><div class="row"><span class="order-no">${esc(t.id)} · ${esc(t.time)}</span>${statusTag(t.status)}</div><h3 class="order-title">${esc(t.title)}</h3><div class="muted">${esc(t.customer)}</div><div class="divider"></div><div class="row"><span class="muted">⌖ ${esc(t.address)}</span><button class="text-btn" data-open-task="${esc(t.id)}">处理 ›</button></div></article>`; }
  function taskDetail(id) { const t=tasks.find(x=>x.id===id)||tasks[0]; if(!t)return engineerHome(); let action=t.status==='待接单'?`<button class="btn full" data-action="accept">接受任务</button>`:t.status==='进行中'?`<div class="field"><label>维修记录</label><textarea id="record-note" placeholder="填写检查结果与处理方式"></textarea></div><div class="actions"><button class="btn secondary" data-action="record">保存记录</button><button class="btn" data-action="finish">完成维修</button></div>`:`<div class="card muted">此任务已完成，记录已保存在本机模拟器。</div>`; return `<main class="page"><button class="back" data-back>‹ 返回任务列表</button><div class="detail-hero" style="margin-top:13px"><div class="row"><span class="order-no">${esc(t.id)}</span>${statusTag(t.status)}</div><h2 class="order-title">${esc(t.title)}</h2><div class="muted">客户：${esc(t.customer)}</div><div class="progress"><i style="width:${t.progress}%"></i></div><div class="muted">${esc(t.time)}</div></div><div class="task-meta"><div class="card"><div class="muted">服务地址</div><b style="display:block;margin-top:8px;font-size:13px">${esc(t.address)}</b></div><div class="card"><div class="muted">现场联系人</div><b style="display:block;margin-top:8px;font-size:13px">张先生 · 138****2206</b></div></div><div class="section-title"><span>现场处理</span></div><div class="card"><div class="row"><div><b>现场照片</b><div class="muted" style="margin-top:5px">拍摄前后对比（模拟）</div></div><button class="btn secondary" id="photo-btn">＋ 添加</button></div><div id="photo-hint" class="hint"></div><div class="divider"></div><div class="muted">定位：仅模拟位置，不请求真实定位权限</div></div>${action}</main>`; }
  function engineerProfile() { const name=localStorage.getItem('demo-engineer-name')||'演示工程师'; return `<main class="page"><h1 class="welcome">个人中心</h1><p class="sub">工程师账号与工作设置</p><div class="profile" style="margin-top:18px"><div class="avatar">${esc(name.slice(0,1).toUpperCase())}</div><div><b>${esc(name)}</b><div class="muted" style="margin-top:5px">维修工程师 · 模拟账号</div></div></div><div class="section-title"><span>今日服务</span></div><div class="card muted">任务 ${tasks.length} 条 · 完成 ${tasks.filter(t=>t.status==='已完成').length} 条</div><button class="btn danger full" data-reset style="margin-top:20px">清除本机模拟数据并退出</button></main>${engineerTabs()}`; }
  function engineerTabs() { return `<nav class="tabs"><button class="${state.tab==='home'?'active':''}" data-tab="home">${icon('wrench')}任务</button><button class="${state.tab==='profile'?'active':''}" data-tab="profile">${icon('user')}我的</button></nav>`; }
  function render() { if(!state.authed){app.innerHTML=login();return} if(role==='customer'){ if(state.page==='apply')app.innerHTML=header()+applyForm(); else if(state.page==='detail')app.innerHTML=header()+repairDetail(state.selected); else if(state.tab==='repairs')app.innerHTML=header()+customerRepairs(); else if(state.tab==='profile')app.innerHTML=header()+customerProfile(); else app.innerHTML=header()+customerHome(); } else { if(state.page==='detail')app.innerHTML=header()+taskDetail(state.selected); else if(state.tab==='profile')app.innerHTML=header()+engineerProfile(); else app.innerHTML=header()+engineerHome(); } }
  app.addEventListener('click',e=>{ const b=e.target.closest('button,[data-open-repair],[data-open-task]'); if(!b)return; if(b.dataset.mode){state.mode=b.dataset.mode;render();return} if(b.dataset.tab){state.tab=b.dataset.tab;state.page='home';render();return} if(b.dataset.page){state.page=b.dataset.page;render();return} if(b.dataset.filter){state.filter=b.dataset.filter;render();return} if(b.dataset.openRepair){state.selected=b.dataset.openRepair;state.page='detail';render();return} if(b.dataset.openTask){state.selected=b.dataset.openTask;state.page='detail';render();return} if(b.hasAttribute('data-back')){state.page='home';render();return} if(b.dataset.confirm){const r=repairs.find(x=>x.id===b.dataset.confirm);if(r){r.status='已完成';r.progress=100;save();toast('已确认维修完成（模拟）');state.page='home';state.tab='repairs';render()}return} if(b.id==='photo-btn'){const h=document.getElementById('photo-hint');if(h)h.textContent='✓ 已添加一张模拟现场照片';return} if(b.dataset.reset!==undefined){['demo-customer-auth','demo-engineer-auth','demo-customer-name','demo-engineer-name','demo-repairs','demo-tasks'].forEach(k=>localStorage.removeItem(k));location.reload();return} if(b.dataset.action==='accept'){const t=tasks.find(x=>x.id===state.selected);if(t){t.status='进行中';t.progress=35;save();toast('已接受任务，状态更新为进行中');render()}return} if(b.dataset.action==='record'){toast('维修记录已保存（模拟）');return} if(b.dataset.action==='finish'){const t=tasks.find(x=>x.id===state.selected);if(t){t.status='已完成';t.progress=100;save();toast('任务已完成（模拟）');render()}return} });
  app.addEventListener('submit',e=>{e.preventDefault(); const f=e.target;if(f.id==='login-form'){const d=new FormData(f),name=String(d.get('username')||'').trim();if(role==='customer'&&state.mode==='activate'&&d.get('invite')!=='DEMO-2026'){toast('演示邀请码不正确');return}if(role==='customer'&&d.get('captcha')!=='4821'){toast('验证码应填写 4821');return}localStorage.setItem(`demo-${role}-auth`,'1');localStorage.setItem(`demo-${role}-name`,name|| (role==='customer'?'演示客户':'演示工程师'));state.authed=true;state.tab='home';render();toast(role==='customer'?'客户登录成功（模拟）':'工程师登录成功（模拟）');return}if(f.id==='apply-form'){const d=new FormData(f),now=new Date(),id=`WX-DEMO-${String(Date.now()).slice(-5)}`;repairs.unshift({id,title:`${d.get('equipment')} · ${d.get('type')}`,status:'待接单',address:d.get('address'),time:`今天 ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`,progress:12});save();state.page='home';state.tab='repairs';render();toast('报修已提交（仅本机模拟）');return}});
  render();
})();
</script>
</body>
</html>
