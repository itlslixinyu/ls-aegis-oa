# Optional same-LAN HTTPS entrypoints. Existing database and application services are reused.
services:
  ls-aegis-mobile-gateway:
    image: ls-aegis-h5:${ITLS_VERSION:-1.2.0}
    container_name: ls-aegis-mobile-gateway
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "${LS_AEGIS_MOBILE_BIND_IP:?Set LAN bind IP}:8443:443"
      - "${LS_AEGIS_MOBILE_BIND_IP:?Set LAN bind IP}:8444:444"
    volumes:
      - ./docker/mobile-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${LS_AEGIS_MOBILE_TLS_DIR:?Set private TLS directory}:/etc/nginx/mobile-tls:ro
    depends_on:
      ls-aegis-h5:
        condition: service_healthy
      ls-aegis-h5-engineer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ls-aegis
