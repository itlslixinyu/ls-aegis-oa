# =============================================================================
# LS·Aegis OA 1.0 生产部署 Compose（仓库根目录）
# ITLS_VERSION 与根 VERSION 一致，仅控制本项目镜像标签。
# 与 docker/docker-compose.yml（本地开发）分离；请勿混用。
# 端口仅绑定 127.0.0.1，公网经宝塔/Nginx 反代。
# 用法：bash scripts/install.sh  或  docker compose --env-file .env up -d --build
# =============================================================================

services:
  ls-aegis-mysql:
    image: mysql:8.0.33
    container_name: ls-aegis-mysql
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "127.0.0.1:25606:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ls_aegis
      TZ: Asia/Shanghai
    volumes:
      - ./docker/data/mysql/data:/var/lib/mysql
      - ./ls-aegis-server/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --explicit_defaults_for_timestamp=true
      - --lower_case_table_names=1
      - --max_allowed_packet=128M
    # 空库首次会跑 docker-entrypoint-initdb.d/init.sql（数分钟）；仅 ping 会过早 healthy。
    # 优先查 _itls_init_done（init.sql 文末写入）；兼容已覆盖的正确库（菜单 30100.sort=4）。
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent && mysql -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD -N -e \"SELECT 1 FROM ls_aegis._itls_init_done WHERE id=1 LIMIT 1\" 2>/dev/null | grep -q 1 || mysql -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD -N -e \"SELECT 1 FROM ls_aegis.sys_menu WHERE id=30100 AND sort=4 AND deleted=0 LIMIT 1\" 2>/dev/null | grep -q 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 600s
    networks:
      - ls-aegis

  ls-aegis-redis:
    image: redis:7.2.8-alpine
    container_name: ls-aegis-redis
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:25679:6379"
    environment:
      TZ: Asia/Shanghai
      REDIS_PWD: ${REDIS_PWD:?请在 .env 设置 REDIS_PWD}
    volumes:
      - ./docker/data/redis/data:/data
      - ./docker/redis/conf:/usr/local/redis/config
    command: ["sh", "-c", "redis-server /usr/local/redis/config/redis.conf --appendonly yes --requirepass \"$$REDIS_PWD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PWD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ls-aegis

  ls-aegis-server:
    build:
      context: .
      dockerfile: docker/ls-aegis-server/Dockerfile.prod
    image: ls-aegis-server:${ITLS_VERSION:-1.2.0}
    container_name: ls-aegis-server
    restart: unless-stopped
    mem_limit: 1536m
    ports:
      - "127.0.0.1:25682:18000"
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m -XX:+UseG1GC}
      DB_HOST: ls-aegis-mysql
      DB_PORT: "3306"
      DB_NAME: ls_aegis
      DB_USER: ${DB_USER:-ls_aegis_app}
      DB_PWD: ${DB_PWD:?请在 .env 设置 DB_PWD}
      REDIS_HOST: ls-aegis-redis
      REDIS_PORT: "6379"
      REDIS_PWD: ${REDIS_PWD:?请在 .env 设置 REDIS_PWD}
      REDIS_DB: "0"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?请在 .env 设置 JWT_SECRET_KEY}
      TOKEN_SECRET: ${TOKEN_SECRET:-}
      ENCRYPT_AES_PASSWORD: ${ENCRYPT_AES_PASSWORD:-}
      ENCRYPT_RSA_PUBLIC_KEY: ${ENCRYPT_RSA_PUBLIC_KEY:-}
      ENCRYPT_RSA_PRIVATE_KEY: ${ENCRYPT_RSA_PRIVATE_KEY:-}
      GM_KEY_STORE_PATH: ${GM_KEY_STORE_PATH:-/app/data/gm/keys.properties}
      FILE_DIGEST_MIGRATE_TO_SM3: ${FILE_DIGEST_MIGRATE_TO_SM3:-false}
      CONTINEW_STARTER_TENANT_ENABLED: ${CONTINEW_STARTER_TENANT_ENABLED:-false}
      SNAIL_JOB_ENABLED: ${SNAIL_JOB_ENABLED:-false}
      SNAIL_JOB_URL: ${SNAIL_JOB_URL:-http://127.0.0.1:8001/snail-job}
      SCHEDULE_TOKEN: ${SCHEDULE_TOKEN:-}
      SCHEDULE_USERNAME: ${SCHEDULE_USERNAME:-schedule}
      SCHEDULE_PASSWORD: ${SCHEDULE_PASSWORD:-}
      APPLICATION_URL: ${APPLICATION_URL:-http://127.0.0.1:25683}
      ITLS_H5_CUSTOMER_URL: ${ITLS_H5_CUSTOMER_URL:-http://127.0.0.1:25684}
      ITLS_H5_ENGINEER_URL: ${ITLS_H5_ENGINEER_URL:-http://127.0.0.1:25685}
      # Docker 内网 MySQL 关闭 SSL；已挂载 init.sql 则关闭 Liquibase，避免与全量 SQL 抢建表
      MYSQL_USE_SSL: "false"
      SPRING_LIQUIBASE_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:mysql://ls-aegis-mysql:3306/ls_aegis?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&rewriteBatchedStatements=true&autoReconnect=true&nullCatalogMeansCurrent=true
    volumes:
      - ./docker/data/ls-aegis-server/config:/app/config
      - ./docker/data/ls-aegis-server/data/file:/app/data/file
      - ./docker/data/ls-aegis-server/data/gm:/app/data/gm
      - ./docker/data/ls-aegis-server/logs:/app/logs
      - ./docker/ls-aegis-server/fonts:/app/fonts:ro
    depends_on:
      ls-aegis-mysql:
        condition: service_healthy
      ls-aegis-redis:
        condition: service_healthy
    healthcheck:
      # 首次 Liquibase/启动较慢；用 bash /dev/tcp 探测端口（镜像含 bash）
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/18000' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 300s
    networks:
      - ls-aegis

  ls-aegis-web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: ls-aegis-web:${ITLS_VERSION:-1.2.0}
    container_name: ls-aegis-web
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:25683:80"
    depends_on:
      ls-aegis-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ls-aegis

  ls-aegis-h5:
    build:
      context: ./ls-aegis-h5
      dockerfile: Dockerfile
      args:
        H5_ROLE: customer
        BASE_PATH: /
    image: ls-aegis-h5:${ITLS_VERSION:-1.2.0}
    container_name: ls-aegis-h5
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:25684:80"
    depends_on:
      ls-aegis-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ls-aegis

  ls-aegis-h5-engineer:
    build:
      context: ./ls-aegis-h5
      dockerfile: Dockerfile
      args:
        H5_ROLE: engineer
        BASE_PATH: /
    image: ls-aegis-h5-engineer:${ITLS_VERSION:-1.2.0}
    container_name: ls-aegis-h5-engineer
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:25685:80"
    depends_on:
      ls-aegis-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ls-aegis

networks:
  ls-aegis:
    name: ls-aegis-prod
    driver: bridge
