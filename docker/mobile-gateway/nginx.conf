# Device geolocation requires a trusted HTTPS origin. Keep certificate validation enabled.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/mobile-tls/mobile.crt;
    ssl_certificate_key /etc/nginx/mobile-tls/mobile.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    location / {
        set $customer_upstream ls-aegis-h5;
        proxy_pass http://$customer_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
server {
    listen 444 ssl;
    server_name _;
    ssl_certificate /etc/nginx/mobile-tls/mobile.crt;
    ssl_certificate_key /etc/nginx/mobile-tls/mobile.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    location / {
        set $engineer_upstream ls-aegis-h5-engineer;
        proxy_pass http://$engineer_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
