worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    # pdfjs worker 等为 .mjs；官方 mime.types 仅含 js，缺省会变成 application/octet-stream，
    # 浏览器 dynamic import 报 Failed to fetch dynamically imported module / Setting up fake worker failed
    types {
        application/javascript mjs;
    }
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    # 仅构建生成的哈希资源长期缓存，HTML 入口每次协商检查版本。
    # map 在 server 层设置响应头，保留现有安全头的继承。
    map $uri $asset_cache_control {
        default "";
        ~^/static/ "public, max-age=31536000, immutable";
        / "no-cache";
        /index.html "no-cache";
    }
    # 限制 body 大小
    client_max_body_size 100m;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # 后端服务（Compose 服务名 / 容器名：ls-aegis-server）
    upstream admin-server {
        ip_hash;
        server ls-aegis-server:18000;
    }

    # 前端项目（静态页面 + /api/ 反向代理到后端）
    server {
        listen       80;
        server_name  localhost _;

        # 安全响应头（容器内 HTTP；公网 HTTPS 由宝塔/Nginx 反代层补充 HSTS）
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control $asset_cache_control;

        location /static/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        # .mjs 必须按 JS 模块返回；缺失时勿回退 index.html（否则也会触发 fake worker 失败）
        location ~* \.mjs$ {
            root   /usr/share/nginx/html;
            default_type application/javascript;
            try_files $uri =404;
        }

        location / {
            root   /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            index  index.html index.htm;
        }

        # /api/ 代理到后端（如果使用 /api/ 前缀代理而不使用 api 域名提供后端服务，可放开此配置）
        location /api/ {
            proxy_pass http://admin-server/;
            proxy_ignore_client_abort on;
            proxy_http_version 1.1;

            # Proxy headers
            # 同源反代：屏蔽 Origin，避免后端 CORS 校验拒绝（后端白名单仅含生产域名）
            proxy_set_header Origin        "";
            proxy_set_header Upgrade       $http_upgrade;
            proxy_set_header Connection    "Upgrade";
            proxy_set_header Host          $host;
            proxy_set_header X-Real-IP     $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket 通知推送反代（通知中心）
        location /websocket {
            proxy_pass http://admin-server;
            proxy_http_version 1.1;
            proxy_set_header Origin           "";
            proxy_set_header Upgrade          $http_upgrade;
            proxy_set_header Connection       "Upgrade";
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
