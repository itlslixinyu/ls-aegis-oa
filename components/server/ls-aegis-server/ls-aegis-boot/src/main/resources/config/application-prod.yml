--- ### 应用配置
application:
  # URL（跨域配置默认放行此 URL，第三方登录回调默认使用此 URL 为前缀，请注意更改为你实际的前端 URL）
  # URL（跨域配置默认放行此 URL；Docker Nginx 默认 8080，可用 APPLICATION_URL 覆盖）
  url: ${APPLICATION_URL:http://localhost:8080}
  # 是否为生产环境
  production: true

--- ### 服务器配置
server:
  # HTTP 端口（默认 8080）
  port: 18000

--- ### 数据源配置
spring.datasource:
  type: com.zaxxer.hikari.HikariDataSource
  # 数据库名可通过环境变量 DB_NAME 覆盖
  url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:ls_aegis}?serverTimezone=Asia/Shanghai&useSSL=${MYSQL_USE_SSL:false}&useUnicode=true&characterEncoding=utf8&rewriteBatchedStatements=true&autoReconnect=true&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
  username: ${DB_USER:root}
  password: ${DB_PWD}
  driver-class-name: com.mysql.cj.jdbc.Driver
  #  # PostgreSQL 配置
  #  url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:ls_aegis}?options=-c%20TimeZone=Asia/Shanghai&sslmode=prefer&channelBinding=prefer&stringtype=unspecified
  #  username: ${DB_USER:postgres}
  #  password: ${DB_PWD}
  #  driver-class-name: org.postgresql.Driver
  #  # 达梦 DM8（信创，驱动需自行引入 DmJdbcDriver18；分页由 MP db-type=DM 处理）
  #  url: jdbc:dm://${DB_HOST:127.0.0.1}:${DB_PORT:5236}/${DB_NAME:LS_AEGIS}?schema=${DB_SCHEMA:LS_AEGIS}
  #  username: ${DB_USER:SYSDBA}
  #  password: ${DB_PWD:}
  #  driver-class-name: dm.jdbc.driver.DmDriver
  #  # 人大金仓 KingbaseES（驱动需自行引入 kingbase8；注意函数方言与 database-id）
  #  url: jdbc:kingbase8://${DB_HOST:127.0.0.1}:${DB_PORT:54321}/${DB_NAME:ls_aegis}
  #  username: ${DB_USER:system}
  #  password: ${DB_PWD:}
  #  driver-class-name: com.kingbase8.Driver
  # Hikari 连接池配置
  hikari:
    # 最大连接数量（默认 10，根据实际环境调整）
    # 注意：当连接达到上限，并且没有空闲连接可用时，获取连接将在超时前阻塞最多 connectionTimeout 毫秒
    maximum-pool-size: 20
    # 获取连接超时时间（默认 30000 毫秒，30 秒）
    connection-timeout: 30000
    # 空闲连接最大存活时间（默认 600000 毫秒，10 分钟）
    idle-timeout: 600000
    # 保持连接活动的频率，以防止它被数据库或网络基础设施超时。该值必须小于 maxLifetime（默认 0，禁用）
    keepaliveTime: 30000
    # 连接最大生存时间（默认 1800000 毫秒，30 分钟）
    max-lifetime: 1800000
## Liquibase 配置
spring.liquibase:
  # 是否启用（Docker 生产若已挂载 sql/init.sql 初始化，请用环境变量 SPRING_LIQUIBASE_ENABLED=false 关闭，避免与全量 SQL 冲突）
  enabled: ${SPRING_LIQUIBASE_ENABLED:true}
  # 配置文件路径
  change-log: classpath:/db/changelog/db.changelog-master.yaml

--- ### 缓存配置
spring.data:
  ## Redis 配置（单机模式）
  redis:
    # 地址
    host: ${REDIS_HOST:127.0.0.1}
    # 端口（默认 6379）
    port: ${REDIS_PORT:6379}
    # 密码（未设置密码时请注释掉）
    password: ${REDIS_PWD}
    # 数据库索引
    database: ${REDIS_DB:0}
    # 连接超时时间
    timeout: 10s
    # 是否开启 SSL
    ssl:
      enabled: false
  ## Redisson 配置
  redisson:
    enabled: true
    mode: SINGLE
## JetCache 配置
jetcache:
  # 统计间隔（默认 0，表示不统计）
  statIntervalMinutes: 0
  ## 本地/进程级/一级缓存配置
  local:
    default:
      # 缓存类型
      type: caffeine
      # key 转换器的全局配置
      keyConvertor: jackson
      # 以毫秒为单位指定超时时间的全局配置
      expireAfterWriteInMillis: 7200000
      # 每个缓存实例的最大元素的全局配置，仅 local 类型的缓存需要指定
      limit: 1000
  ## 远程/分布式/二级缓存配置
  remote:
    default:
      # 缓存类型
      type: redisson
      # key 转换器的全局配置（用于将复杂的 KEY 类型转换为缓存实现可以接受的类型）
      keyConvertor: jackson
      # 以毫秒为单位指定超时时间的全局配置
      expireAfterWriteInMillis: 7200000
      # 2.7+ 支持两级缓存更新以后失效其他 JVM 中的 local cache，但多个服务共用 Redis 同一个 channel 可能会造成广播风暴，需要在这里指定channel。
      # 你可以决定多个不同的服务是否共用同一个 channel，如果没有指定则不开启。
      broadcastChannel: ${spring.application.name}
      # 序列化器：kryo5，避免 Java 反序列化攻击面（勿用 java）
      valueEncoder: kryo5
      valueDecoder: kryo5

--- ### 接口文档配置
## ContiNew/Knife4j 依赖 SpringDoc Bean，不能设 api-docs.enabled=false（会启动失败）。
## 生产：关闭 Swagger UI + knife4j.production；/v3/api-docs 未加入 sa-token excludes，需登录。
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

--- ### 接口文档增强配置
knife4j:
  enable: true
  production: true

--- ### 跨域配置
continew-starter.web.cors:
  enabled: true
  # 配置允许跨域的域名（PC + 双 H5 子域；开发机 Vite）
  allowed-origins:
    - ${application.url}
    - ${ITLS_H5_CUSTOMER_URL:http://127.0.0.1:25684}
    - ${ITLS_H5_ENGINEER_URL:http://127.0.0.1:25685}
    - http://localhost:5173
    - http://127.0.0.1:5173
  # 配置允许跨域的请求方式
  allowed-methods: '*'
  # 配置允许跨域的请求头
  allowed-headers: '*'
  # 配置允许跨域的响应头
  exposed-headers: '*'

--- ### 日志配置
## API 请求/响应日志配置
continew-starter.log:
  access-log:
    # 是否打印访问日志（类似于 Nginx access log）
    enabled: false
## 项目日志配置（配置重叠部分，优先级高于 logback-spring.xml 中的配置）
logging:
  level:
    com.ls.aegis.boot: INFO
    top.continew.starter: INFO
  file:
    path: /app/logs

--- ### 加密配置：密码编码器配置
## 整体国密：运行时以 ls-aegis-crypto gmPasswordEncoder 为准（新口令 SM3，校验兼容存量 BCrypt）
continew-starter.encrypt.password-encoder:
  enabled: true
  algorithm: BCRYPT

--- ### 加密配置：字段加/解密配置
## 整体国密：业务敏感字段使用 Sm4Encryptor；下方 AES/RSA 仅在 gm.legacy-*=true 或 gm.enable=false 时使用
continew-starter.encrypt.field:
  enabled: true
  algorithm: AES
  # 整体国密默认用 Sm4Encryptor；以下仅 gm.enable=false 或 legacy 回退时使用，禁止写入仓库明文
  password: ${ENCRYPT_AES_PASSWORD:}
  public-key: ${ENCRYPT_RSA_PUBLIC_KEY:}
  private-key: ${ENCRYPT_RSA_PRIVATE_KEY:}

--- ### 验证码配置
continew-starter.captcha:
  ## 行为验证码
  behavior:
    enabled: true
    cache-type: REDIS
    water-mark:
    # 一分钟内接口请求次数限制开关（默认：0，关闭，开启后下方失败锁定配置才会生效）
    req-frequency-limit-enable: 0
    # 一分钟内验证码最多失败次数限制（默认：5次）
    req-get-lock-limit: 5
    # 一分钟内验证码最多失败次数限制达标后锁定时间（默认：300秒）
    req-get-lock-seconds: 300
  ## 图形验证码
  graphic:
    # 类型
    type: SPEC
    # 内容长度
    length: 4
    # 过期时间
    expirationInMinutes: 2
## 其他验证码配置
captcha:
  ## 邮箱验证码配置
  mail:
    # 内容长度
    length: 6
    # 过期时间
    expirationInMinutes: 5
    # 模板路径
    templatePath: mail/captcha.ftl

--- ### 邮件配置
## 提示：配置文件方式和 [系统管理/系统配置/邮件配置] 功能可任选其一方式使用，实际开发时请注释或删除另一方
