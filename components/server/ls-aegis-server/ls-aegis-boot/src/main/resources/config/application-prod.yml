--- ### WebSocket 配置
continew-starter.messaging.websocket:
  enabled: true
  path: /websocket
  # 配置允许跨域的域名（含 Vite 开发地址）
  allowed-origins:
    - ${application.url}
    - http://localhost:5173
    - http://127.0.0.1:5173

--- ### Sa-Token 扩展配置
sa-token.extension:
  # 安全配置：排除（放行）路径配置
  security.excludes:
    - /error
    # 静态资源
    - /*.html
    - /*/*.html
    - /*/*.css
    - /*/*.js
    - /websocket/**
    # 仅放行公开头像静态资源；其它 /file/** 须鉴权（避免匿名下载）
    - /file/user/avatar/**

--- ### Just Auth 配置（默认关闭，避免非业务外连 GitHub/Gitee/微信）
justauth:
  enabled: ${JUSTAUTH_ENABLED:false}
  type:
    WECHAT_OPEN:
      client-id: ${JUSTAUTH_WECHAT_CLIENT_ID:}
      client-secret: ${JUSTAUTH_WECHAT_CLIENT_SECRET:}
      redirect-uri: ${application.url}/social/callback?source=wechat_open
    GITEE:
      client-id: ${JUSTAUTH_GITEE_CLIENT_ID:}
      client-secret: ${JUSTAUTH_GITEE_CLIENT_SECRET:}
      redirect-uri: ${application.url}/social/callback?source=gitee
    GITHUB:
      client-id: ${JUSTAUTH_GITHUB_CLIENT_ID:}
      client-secret: ${JUSTAUTH_GITHUB_CLIENT_SECRET:}
      redirect-uri: ${application.url}/social/callback?source=github
  cache:
    type: DEFAULT

--- ### Snail Job 配置
snail-job:
  # 默认关闭；启用时须通过环境变量注入令牌与口令（禁止仓库弱默认值）
  enabled: ${SNAIL_JOB_ENABLED:false}
  # 客户端地址（默认自动获取本机 IP）
  #host: 127.0.0.1
  # 客户端端口（默认：1789）
  port: 1789
  # 命名空间 ID
  namespace: ${SCHEDULE_NAMESPACE:}
  # 分组名
  group: ${SCHEDULE_GROUP:ls-aegis}
  # 令牌
  token: ${SCHEDULE_TOKEN:}
  ## 服务端配置（任务调度中心）
  server:
    # 服务端地址，若服务端集群部署则此处配置域名
    host: ${SCHEDULE_HOST:127.0.0.1}
    # Netty 端口号
    port: ${SCHEDULE_PORT:1788}
    # API 配置
    api:
      # URL
      url: ${SNAIL_JOB_URL:http://127.0.0.1:8001/snail-job}
      # 用户名
      username: ${SCHEDULE_USERNAME:}
      # 密码
      password: ${SCHEDULE_PASSWORD:}