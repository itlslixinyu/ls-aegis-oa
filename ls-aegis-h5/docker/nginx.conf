# LS・Aegis H5 移动端 Nginx（Compose 内反代 ls-aegis-server:18000）
upstream h5-backend {
    server ls-aegis-server:18000;
}

server {
    listen       80;
    server_name  localhost;

    # 上传文件大小限制
    client_max_body_size 100m;

    # gzip压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
    gzip_min_length 1k;

    # 安全响应头（server 级，被 location 级 add_header 覆盖时需在 location 内重加）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ===== 关键修复：index.html 强制每次向服务器重新验证，不能被浏览器强缓存 =====
    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        # 安全响应头（location 级 add_header 会覆盖 server 级，必须重加）
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 默认首页：客户站 → /customer/auth，工程师站 → /engineer/login（由 SPA 路由按构建角色跳转）
location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 带内容 hash 的静态资源：内容变则文件名必变，可以放心强缓存 30 天
    # 注意：.html 绝不要出现在此匹配规则里
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        root   /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # 安全响应头（location 级 add_header 会覆盖 server 级，必须重加）
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # EOMS 业务接口代理（^~ 阻止被静态资源正则覆盖）
    location ^~ /eoms/ {
        # 同源反代：清空 Origin，避免后端 CORS 把伪造的 localhost:8080 判为跨域 403
        proxy_set_header Origin "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://h5-backend/eoms/;
    }

    # 平台鉴权（登录 / 用户信息 / 国密公钥 / 登出）
    location ^~ /auth/ {
        # 同源反代：清空 Origin，避免后端 CORS 把伪造的 localhost:8080 判为跨域 403
        proxy_set_header Origin "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://h5-backend;
    }

    # 图片验证码
    location ^~ /captcha/ {
        # 同源反代：清空 Origin，避免后端 CORS 把伪造的 localhost:8080 判为跨域 403
        proxy_set_header Origin "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://h5-backend;
    }

    # 上传文件代理（^~ 阻止被静态资源正则覆盖）
    location ^~ /profile/ {
        # 同源反代：清空 Origin，避免后端 CORS 把伪造的 localhost:8080 判为跨域 403
        proxy_set_header Origin "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_pass http://h5-backend/profile/;
    }

    # 平台文件中心静态资源（C3：sys_file 预览）
    location ^~ /file/ {
        # 同源反代：清空 Origin，避免后端 CORS 把伪造的 localhost:8080 判为跨域 403
        proxy_set_header Origin "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_pass http://h5-backend/file/;
    }

    # 与 PC 一致：/api/file 访问平台文件
    location ^~ /api/ {
        # 同源反代：清空 Origin，避免后端 CORS 把伪造的 localhost:8080 判为跨域 403
        proxy_set_header Origin "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_pass http://h5-backend/;
    }

    # 系统公共接口（SITE 外观等，含 /system/common/dict/option/site）
    location ^~ /system/ {
        # 同源反代：清空 Origin，避免后端 CORS 把伪造的 localhost:8080 判为跨域 403
        proxy_set_header Origin "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_pass http://h5-backend;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
