# ===========================================================================
# 宝塔 / 系统 Nginx 反代模板 — LS・Aegis（三域名）
# 占位符：
#   OA_DOMAIN  PC 后台（如 oa.ls.hb.cn）→ 25683，/api/ /websocket → 25682
#   KH_DOMAIN  H5 客户（如 kh.ls.hb.cn）→ 25684（容器内已反代 API）
#   GC_DOMAIN  H5 工程师（如 gc.ls.hb.cn）→ 25685
# ===========================================================================

# ----- PC 后台 -----
server {
    listen 80;
    server_name OA_DOMAIN;
    client_max_body_size 100m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://127.0.0.1:25682/;
        proxy_http_version 1.1;
        proxy_set_header Origin "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /websocket {
        proxy_pass http://127.0.0.1:25682;
        proxy_http_version 1.1;
        proxy_set_header Origin "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:25683;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /www/wwwlogs/OA_DOMAIN.log;
    error_log  /www/wwwlogs/OA_DOMAIN.error.log;
}

