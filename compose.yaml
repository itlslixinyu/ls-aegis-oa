{
  "name": "ls-aegis-oa-service",
  "services": {
    "ls-aegis-mysql": {
      "image": "mysql:8.0.42",
      "pull_policy": "never",
      "networks": [
        "business"
      ],
      "restart": "unless-stopped",
      "environment": {
        "MYSQL_DATABASE": "ls_aegis",
        "TZ": "Asia/Shanghai",
        "MYSQL_ROOT_PASSWORD": "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}"
      },
      "command": [
        "--default-authentication-plugin=mysql_native_password",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_general_ci",
        "--explicit_defaults_for_timestamp=true",
        "--lower_case_table_names=1",
        "--max_allowed_packet=128M"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --protocol=TCP -h127.0.0.1 -uroot ls_aegis -Nse \"SELECT finished_at FROM _itls_init_done WHERE id=1\" | grep -q ."
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 60
      },
      "volumes": [
        "./runtime/mysql:/var/lib/mysql",
        "./components/server/ls-aegis-server/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro"
      ],
      "container_name": "ls-aegis-mysql"
    },
    "ls-aegis-redis": {
      "image": "redis:7.2.8",
      "pull_policy": "never",
      "networks": [
        "business"
      ],
      "restart": "unless-stopped",
      "environment": {
        "REDIS_PWD": "${REDIS_PWD:?set REDIS_PWD}",
        "TZ": "Asia/Shanghai"
      },
      "command": [
        "sh",
        "-ec",
        "exec redis-server /usr/local/redis/config/redis.conf --requirepass \"$$REDIS_PWD\""
      ],
      "volumes": [
        "./runtime/redis:/data",
        "./config/redis.conf:/usr/local/redis/config/redis.conf:ro"
      ],
      "container_name": "ls-aegis-redis"
    },
    "ls-aegis-server": {
      "image": "ls-aegis-server:1.4.0-20261121t092826z-864d33038188",
      "pull_policy": "never",
      "networks": [
        "business"
      ],
      "restart": "unless-stopped",
      "environment": {
        "EOMS_WECHAT_CUSTOMER_TIMEFIELD": "${EOMS_WECHAT_CUSTOMER_TIMEFIELD:-}",
        "EOMS_WECHAT_APPID": "${EOMS_WECHAT_APPID:-}",
        "SCHEDULE_USERNAME": "${SCHEDULE_USERNAME:-}",
        "APPLICATION_URL": "${APPLICATION_URL:-}",
        "SCHEDULE_PASSWORD": "${SCHEDULE_PASSWORD:-}",
        "SPRING_DATASOURCE_DRIVER_CLASS_NAME": "com.mysql.cj.jdbc.Driver",
        "SNAIL_JOB_URL": "${SNAIL_JOB_URL:-}",
        "EOMS_WECHAT_ENGINEER_NUMBERFIELD": "${EOMS_WECHAT_ENGINEER_NUMBERFIELD:-}",
        "EOMS_WECHAT_CUSTOMER_NUMBERFIELD": "${EOMS_WECHAT_CUSTOMER_NUMBERFIELD:-}",
        "WECHAT_MINIAPP_SECRET": "${WECHAT_MINIAPP_SECRET:-}",
        "DB_PWD": "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}",
        "EOMS_WECHAT_APPSECRET": "${WECHAT_MINIAPP_SECRET:-}",
        "LS_AEGIS_LOG_DIR": "./docker/data/ls-aegis-server/logs",
        "ENCRYPT_AES_PASSWORD": "${ENCRYPT_AES_PASSWORD:-}",
        "EOMS_WECHAT_MINIPROGRAMSTATE": "${EOMS_WECHAT_MINIPROGRAMSTATE:-}",
        "LS_AEGIS_MYSQL_VOLUME": "${LS_AEGIS_MYSQL_VOLUME:-}",
        "LS_AEGIS_DATA_DIR": "${LS_AEGIS_DATA_DIR:-}",
        "DB_HOST": "ls-aegis-mysql",
        "EOMS_WECHAT_ENGINEER_ID": "${EOMS_WECHAT_ENGINEER_ID:-}",
        "ITLS_VERSION": "1.3.1",
        "CONTINEW_STARTER_TENANT_ENABLED": "false",
        "SCHEDULE_TOKEN": "${SCHEDULE_TOKEN:-}",
        "LS_AEGIS_MOBILE_BIND_IP": "${LS_AEGIS_MOBILE_BIND_IP:-}",
        "MYSQL_ROOT_PASSWORD": "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}",
        "SPRING_LIQUIBASE_ENABLED": "false",
        "EOMS_WECHAT_ENGINEER_STATUSFIELD": "${EOMS_WECHAT_ENGINEER_STATUSFIELD:-}",
        "DB_USER": "root",
        "GM_KEY_STORE_PATH": "/app/data/gm/keys.properties",
        "REDIS_DB": "0",
        "SPRING_PROFILES_ACTIVE": "dev",
        "REDIS_HOST": "ls-aegis-redis",
        "SPRING_DATASOURCE_URL": "jdbc:mysql://ls-aegis-mysql:3306/ls_aegis?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai",
        "EOMS_WECHAT_CUSTOMER_STATUSFIELD": "${EOMS_WECHAT_CUSTOMER_STATUSFIELD:-}",
        "REDIS_PORT": "6379",
        "TOKEN_SECRET": "${TOKEN_SECRET:-}",
        "LS_AEGIS_MOBILE_TLS_DIR": "${LS_AEGIS_MOBILE_TLS_DIR:-}",
        "JWT_SECRET_KEY": "${JWT_SECRET_KEY:?set JWT_SECRET_KEY}",
        "ITLS_H5_CUSTOMER_URL": "${ITLS_H5_CUSTOMER_URL:-}",
        "EOMS_WECHAT_CUSTOMER_ID": "${EOMS_WECHAT_CUSTOMER_ID:-}",
        "ENCRYPT_RSA_PRIVATE_KEY": "${ENCRYPT_RSA_PRIVATE_KEY:-}",
        "DB_PORT": "3306",
        "EOMS_WECHAT_ENGINEER_TIMEFIELD": "${EOMS_WECHAT_ENGINEER_TIMEFIELD:-}",
        "SNAIL_JOB_ENABLED": "false",
        "ENCRYPT_RSA_PUBLIC_KEY": "${ENCRYPT_RSA_PUBLIC_KEY:-}",
        "REDIS_PWD": "${REDIS_PWD:?set REDIS_PWD}",
        "FILE_DIGEST_MIGRATE_TO_SM3": "false",
        "DB_NAME": "ls_aegis",
        "EOMS_WECHAT_ENGINEER_TITLEFIELD": "${EOMS_WECHAT_ENGINEER_TITLEFIELD:-}",
        "MYSQL_USE_SSL": "false",
        "ITLS_H5_ENGINEER_URL": "${ITLS_H5_ENGINEER_URL:-}",
        "JAVA_OPTS": "-Xms256m -Xmx1024m -XX:+UseG1GC",
        "LS_AEGIS_REDIS_VOLUME": "${LS_AEGIS_REDIS_VOLUME:-}"
      },
      "depends_on": {
        "ls-aegis-mysql": {
          "condition": "service_healthy"
        },
        "ls-aegis-redis": {
          "condition": "service_started"
        }
      },
      "volumes": [
        "./runtime/server/data:/app/data",
        "./runtime/server/logs:/app/logs",
        "./runtime/fonts/simhei.ttf:/app/fonts/simhei.ttf:ro"
      ],
      "container_name": "ls-aegis-server",
      "build": {
        "context": "./components/server",
        "dockerfile": "docker/ls-aegis-server/Dockerfile.prod"
      }
    },
    "ls-aegis-web": {
      "image": "ls-aegis-web:1.4.0-20261121t053813z-55a1d73ac564",
      "pull_policy": "never",
      "networks": [
        "business",
        "access"
      ],
      "restart": "unless-stopped",
      "environment": {},
      "ports": [
        "${OA_BIND_IP:?set OA_BIND_IP}:18080:80"
      ],
      "depends_on": [
        "ls-aegis-server"
      ],
      "container_name": "ls-aegis-web",
      "build": {
        "context": "./components/pc",
        "dockerfile": "docker/nginx/Dockerfile"
      }
    },
    "ls-aegis-h5": {
      "image": "ls-aegis-h5:1.4.0-20261114t090631z-fa6bc83852b9",
      "pull_policy": "never",
      "networks": [
        "business",
        "access"
      ],
      "restart": "unless-stopped",
      "environment": {},
      "ports": [
        "${OA_BIND_IP:?set OA_BIND_IP}:18081:80"
      ],
      "depends_on": [
        "ls-aegis-server"
      ],
      "volumes": [
        "./runtime/wechat/DVG00SNpT8.txt:/usr/share/nginx/html/DVG00SNpT8.txt:ro"
      ],
      "container_name": "ls-aegis-h5",
      "build": {
        "context": "./components/customer/ls-aegis-h5",
        "args": {
          "H5_ROLE": "customer",
          "BASE_PATH": "/"
        }
      }
    },
    "ls-aegis-h5-engineer": {
      "image": "ls-aegis-h5-engineer:1.4.0-20261121t093547z-0a82b4803fe3",
      "pull_policy": "never",
      "networks": [
        "business",
        "access"
      ],
      "restart": "unless-stopped",
      "environment": {},
      "ports": [
        "${OA_BIND_IP:?set OA_BIND_IP}:18082:80"
      ],
      "depends_on": [
        "ls-aegis-server"
      ],
      "volumes": [
        "./runtime/wechat/DVG00SNpT8.txt:/usr/share/nginx/html/DVG00SNpT8.txt:ro"
      ],
      "container_name": "ls-aegis-h5-engineer",
      "build": {
        "context": "./components/engineer/ls-aegis-h5",
        "args": {
          "H5_ROLE": "engineer",
          "BASE_PATH": "/"
        }
      }
    },
    "ls-aegis-mobile-gateway": {
      "image": "ls-aegis-h5:1.4.0-20261114t080227z-4f37f31c11d1",
      "pull_policy": "never",
      "networks": [
        "business",
        "access"
      ],
      "restart": "unless-stopped",
      "environment": {},
      "ports": [
        "${OA_BIND_IP:?set OA_BIND_IP}:18443:443",
        "${OA_BIND_IP:?set OA_BIND_IP}:18444:444"
      ],
      "depends_on": [
        "ls-aegis-h5",
        "ls-aegis-h5-engineer"
      ],
      "volumes": [
        "./runtime/tls:/etc/nginx/mobile-tls:ro",
        "./config/mobile-nginx.conf:/etc/nginx/conf.d/default.conf:ro"
      ],
      "container_name": "ls-aegis-mobile-gateway",
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "nginx -t >/dev/null 2>&1"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 5
      },
      "build": {
        "context": "./components/gateway/ls-aegis-h5",
        "args": {
          "H5_ROLE": "customer",
          "BASE_PATH": "/"
        }
      }
    }
  },
  "networks": {
    "business": {
      "internal": true
    },
    "access": {}
  }
}
