databaseChangeLog:
  - preConditions:
      - onFail: HALT
      - onError: HALT
      - dbms:
          type: postgresql
      - tableExists:
          tableName: psi_stock_batch
      - sqlCheck:
          expectedResult: "1"
          sql: >-
            SELECT CASE WHEN COUNT(*)=0 THEN 1 WHEN COUNT(*)=1 AND bool_and(
              t.relname='psi_stock_batch' AND am.amname='btree' AND NOT i.indisunique
              AND i.indisvalid AND i.indisready AND i.indpred IS NULL AND i.indexprs IS NULL
              AND i.indnatts=5 AND i.indnkeyatts=5
              AND (SELECT string_agg(a.attname,',' ORDER BY k.ordinality)
                   FROM unnest(i.indkey) WITH ORDINALITY k(attnum,ordinality)
                   JOIN pg_attribute a ON a.attrelid=i.indrelid AND a.attnum=k.attnum)
                  ='tenant_id,deleted,goods_id,warehouse_id,remain_quantity'
              AND NOT EXISTS (SELECT 1 FROM unnest(i.indoption) opt WHERE opt<>0)
              AND NOT EXISTS (SELECT 1 FROM unnest(i.indclass) cls(opcoid)
                              JOIN pg_opclass opc ON opc.oid=cls.opcoid WHERE NOT opc.opcdefault)
              AND NOT EXISTS (SELECT 1 FROM unnest(i.indcollation) col(collid) WHERE col.collid<>0::oid)
            ) THEN 1 ELSE 0 END
            FROM pg_class x JOIN pg_namespace n ON n.oid=x.relnamespace
            JOIN pg_index i ON i.indexrelid=x.oid JOIN pg_class t ON t.oid=i.indrelid
            JOIN pg_am am ON am.oid=x.relam
            WHERE n.nspname=current_schema() AND x.relname='idx_stock_alert_balance'
  - changeSet:
      id: r31_stock_alert_balance_index_postgresql
      author: ls
      dbms: postgresql
      runInTransaction: false
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - not:
            - indexExists:
                tableName: psi_stock_batch
                indexName: idx_stock_alert_balance
      changes:
        - sqlFile:
            path: db/changelog/postgresql/patch_stock_alert_balance_index.sql
            encoding: UTF-8
            splitStatements: true
            stripComments: true
